<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BESTIARY — every beast is a number</title>
<meta name="description" content="Type a name and it becomes a collage-beast. No models, no textures, no image files — every mark is drawn from one number.">
<meta name="theme-color" content="#08080A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2308080A'/%3E%3Cpath d='M4 12 L8 3 L12 12 Z' fill='%23C8952D'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400&display=swap">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<canvas id="wall" aria-hidden="true"></canvas>
<canvas id="undergrowth" aria-hidden="true"></canvas>
<div id="grain" aria-hidden="true"></div>

<header>
  <button class="brand" id="home" type="button">
    BESTIARY
    <small>EVERY BEAST IS A NUMBER</small>
  </button>
  <div class="header-right">
    <button class="linkish mono" id="stranger" type="button">show a stranger</button>
    <a class="linkish mono" id="archivelink" href="https://lodhang-archive.vercel.app">the archive</a>
  </div>
</header>

<main>
  <!-- SUMMON -->
  <section class="summon" id="view-summon">
    <h1>Make your beast</h1>

    <!-- The summon square sits inside the rail, not below it: the beasts
         already in the room stand on either side of the empty plinth. -->
    <div class="rail" id="rail" aria-label="Beasts already in the menagerie">
      <button class="plus" id="plus" type="button" aria-label="Summon a beast at random">+</button>
    </div>

    <p class="or micro">OR</p>

    <form class="namebar" id="namebar">
      <label class="sr-only" for="nameinput">Type a name</label>
      <input id="nameinput" type="text" placeholder="type your name" autocomplete="off"
             spellcheck="false" maxlength="48">
      <button class="btn mono" type="submit">Summon</button>
    </form>

    <p class="micro" style="color:var(--n-iron);max-width:46ch">
      The same name always makes the same beast. Nothing is stored and nothing is
      uploaded — the number is the whole animal.
    </p>
  </section>

  <!-- RESULT -->
  <section class="result" id="view-result" hidden>
    <div class="result-canvas is-lit" id="stage"></div>
    <div class="plate" id="plate"></div>
  </section>
</main>

<footer>
  <span class="micro">DRAWN IN CODE. NO MODELS, NO TEXTURES, NO IMAGE FILES.</span>
  <span class="micro">PALETTES AFTER <a id="artistlink" href="https://lodhang-archive.vercel.app">JAKA LODHANG</a></span>
</footer>

<div id="status" class="mono" role="status" aria-live="polite"></div>

<noscript>
  <div style="padding:22vh 8vw;max-width:60ch">
    <h1 style="font-family:Georgia,serif;color:#efede6">BESTIARY</h1>
    <p>Every beast here is generated from a number, in the browser. That needs
       JavaScript, so there is nothing to show without it.</p>
  </div>
</noscript>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
