<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>bestiary — contact sheet</title>
<style>
  body { margin: 0; background: #08080a; color: #bebcb2;
         font: 11px/1.3 ui-monospace, Consolas, monospace; letter-spacing: 0.1em; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; padding: 12px; }
  figure { margin: 0; }
  canvas { width: 100%; height: auto; display: block; background: #000; }
  figcaption { padding: 4px 0; color: #8c8c83; text-transform: uppercase; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script type="module">
import { genome, drawBeast, W, H } from './assets/js/beast.js'

const names = [
  'ada lovelace', 'akbar', 'jaka lodhang', 'margin chan', 'sharpbyte',
  'the shepherd', 'tugou', 'mintdle', 'grass', 'arsenal',
  'cope capital', 'regime desk', 'vaccine', 'sleuth', 'lashaun',
  'brush', 'excel', 'basis war', 'oracle', 'pharos',
  'hyperliquid', 'robinhood', 'seed one', 'seed two',
]
const grid = document.getElementById('grid')
for (const n of names) {
  const fig = document.createElement('figure')
  const cv = document.createElement('canvas')
  cv.width = W; cv.height = H
  const g = genome(( () => {
    // inline seedFromName to avoid an extra import in this scratch page
    let h = 0x811c9dc5
    const s = n.normalize('NFKC').trim().toLowerCase()
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) }
    return (h >>> 0) % 100000000
  })())
  drawBeast(cv.getContext('2d'), g)
  const cap = document.createElement('figcaption')
  cap.textContent = `${n} · ${g.head} · ${g.body} · ${g.palette.id}`
  fig.append(cv, cap)
  grid.appendChild(fig)
}
window.__ready = true
window.__diag = { view: 'sheet', works: names.length }
</script>
</body>
</html>
